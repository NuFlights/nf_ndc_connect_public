name: Release & Publish

on:
  push:
    tags:
      - 'v*' # Triggers only on version tags, e.g., v0.1.0

permissions:
  contents: read

jobs:
  # ============================================================================
  #  1. RUST (CRATES.IO)
  # ============================================================================
  publish-crate:
    name: Publish to Crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish to Crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        # We publish with default features (Pure Rust)
        run: cargo publish

  # ============================================================================
  #  2A. PYTHON (BUILD WHEELS)
  #  Builds binaries for Linux, macOS, and Windows
  # ============================================================================
  pypi-build-wheels:
    name: Build Wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Build Wheels
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist --features python
          sccache: 'true'

      - name: Upload Wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: dist

  # ============================================================================
  #  2B. PYTHON (BUILD SDIST)
  #  Builds the Source Distribution (critical fallback for other OSes)
  # ============================================================================
  pypi-build-sdist:
    name: Build Source Dist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - name: Upload Sdist
        uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  # ============================================================================
  #  2C. PYTHON (PUBLISH)
  #  Collects all artifacts and pushes to PyPI
  # ============================================================================
  pypi-publish:
    name: Publish to PyPI
    needs: [pypi-build-wheels, pypi-build-sdist]
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for Trusted Publishing
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          # Download all artifacts matching the pattern
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          # verify-metadata: false
          # attestations: true

  # ============================================================================
  #  3. WASM / NODE (NPM)
  # ============================================================================
  publish-npm:
    name: Publish to NPM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # Build specifically for Node.js usage
      - name: Build Wasm Package
        run: |
          wasm-pack build \
            --target web \
            --scope dhilipsiva \
            -- \
            --features wasm

      # wasm-pack generates a pkg/ directory. We publish that.
      - name: Publish to NPM
        run: cd pkg && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
