<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Wasm IDP Auth Test</title>
        <style>
            body {
                font-family: monospace;
                background: #1e1e1e;
                color: #d4d4d4;
                padding: 2rem;
            }

            .success {
                color: #4caf50;
            }

            .fail {
                color: #f44336;
            }

            .info {
                color: #569cd6;
            }

            .warn {
                color: #ce9178;
            }
        </style>
    </head>

    <body>
        <h1>Rust Wasm IDP Auth Helper</h1>
        <div id="output">Loading...</div>

        <script type="module">
            import init, {
                IdpAuthHelper,
            } from "./pkg/nf_ndc_connect_public.js";

            async function run() {
                const out = document.getElementById("output");
                const log = (msg, cls = "info") => {
                    const div = document.createElement("div");
                    div.innerHTML = msg;
                    div.className = cls;
                    out.appendChild(div);
                };

                try {
                    // 1. Initialize Wasm
                    await init();
                    out.innerHTML = "";

                    // 2. Load Public Key and JWT
                    const [certRes, jwtRes] = await Promise.all([
                        fetch("./cert.pem"),
                        fetch("./sample-jwt.txt"),
                    ]);
                    const publicKey = await certRes.text();
                    const rawJwt = (await jwtRes.text()).trim();

                    // 3. Initialize Helper
                    log("Initializing Helper with Public Key...");
                    const helper = new IdpAuthHelper(publicKey, "connect-development");
                    log("Helper Initialized", "success");

                    // 4. Validate JWT & Get User Context
                    const isValid = helper.isValid(rawJwt);
                    log(
                        `isValid(JWT): <b>${isValid}</b>`,
                        isValid ? "success" : "fail",
                    );
                    if (!isValid) {
                        log("JWT is invalid (likely expired). Stopping.", "fail");
                        return;
                    }

                    const user = helper.validate(rawJwt);
                    log("User Context Parsed", "success");

                    // 5. List Group Summaries
                    const summaries = user.summaries;

                    log(`<br><b>User Group Summaries:</b>`);
                    summaries.forEach((s) => {
                        log(
                            `&nbsp;&nbsp;<b>${s.group}</b>`,
                        );
                        log(
                            `&nbsp;&nbsp;&nbsp;&nbsp;Role: ${s.role}`,
                        );
                        s.permissions.forEach((p) =>
                            log(`&nbsp;&nbsp;&nbsp;&nbsp;Permission: ${p}`),
                        );
                    });

                    // Use real values from the sample JWT
                    // Single role: account.custom.KEixtFTW
                    // Single group: connect-development/connect-development_T-2345
                    // After stripping group_prefix "connect-development_", short code = "T-2345"
                    const testGroup = "T-2345";
                    const testRole = "account.custom.KEixtFTW";
                    const testPerm1 = "agencies.view";
                    const testPerm2 = "travel.orders.create";
                    const testPermNone = "nonexistent.permission";

                    // 6. Check group membership
                    const hasGrp = user.hasGroup(testGroup);
                    log(
                        `<br>hasGroup('${testGroup}'): <b>${hasGrp}</b>`,
                        hasGrp ? "success" : "fail",
                    );

                    // 7. Check role for a specific group
                    const hasRole = user.hasRole(testRole, testGroup);
                    log(
                        `<br>hasRole('${testRole}', '${testGroup}'): <b>${hasRole}</b>`,
                        hasRole ? "success" : "fail",
                    );

                    // 8. Check permission for a specific group
                    const hasPerm1 = user.hasPermission(testPerm1, testGroup);
                    log(
                        `<br>hasPermission('${testPerm1}', '${testGroup}'): <b>${hasPerm1}</b>`,
                        hasPerm1 ? "success" : "fail",
                    );

                    const hasPerm2 = user.hasPermission(testPerm2, testGroup);
                    log(
                        `hasPermission('${testPerm2}', '${testGroup}'): <b>${hasPerm2}</b>`,
                        hasPerm2 ? "success" : "fail",
                    );

                    // Non-existent permission should be false
                    const hasPermNone = user.hasPermission(testPermNone, testGroup);
                    log(
                        `hasPermission('${testPermNone}', '${testGroup}'): <b>${hasPermNone}</b> (expected false)`,
                        !hasPermNone ? "success" : "fail",
                    );

                    // 9. Check Multiple Permissions

                    // 9a. hasPermissions (ALL must exist)
                    const reqPermsAll = [testPerm1, testPerm2];
                    const hasAll = user.hasPermissions(reqPermsAll, testGroup);
                    log(
                        `<br>hasPermissions(['${reqPermsAll.join("', '")}'], '${testGroup}'): <b>${hasAll}</b>`,
                        hasAll ? "success" : "fail",
                    );

                    // 9b. hasPermissionsAny (AT LEAST ONE must exist)
                    const reqPermsAny = [testPerm1, "nonexistent.perm"];
                    const hasAny = user.hasPermissionsAny(reqPermsAny, testGroup);
                    log(
                        `hasPermissionsAny(['${reqPermsAny.join("', '")}'], '${testGroup}'): <b>${hasAny}</b>`,
                        hasAny ? "success" : "fail",
                    );

                    // 10. Optional group -- omit group_name (should work since user has only 1 group)
                    log(`<br><b>Testing optional group (null):</b>`);

                    const resultOptional = user.hasPermission(testPerm1, null);
                    log(
                        `hasPermission('${testPerm1}', null): <b>${resultOptional}</b> (expected true, single group inferred)`,
                        resultOptional ? "success" : "fail",
                    );

                    // 11. User property checks
                    log(`<br>isAdmin: <b>${user.isAdmin}</b>`);
                    log(`username: <b>${user.username}</b>`);
                    log(`email: <b>${user.email}</b>`);
                    log(`dj_id: <b>${user.dj_id}</b>`);
                    log(`getOrgCount: <b>${user.getOrgCount()}</b>`);
                    log(`getFirstOrgShortCode: <b>${user.getFirstOrgShortCode()}</b>`);

                    log(`<br><b>All tests completed.</b>`, "success");
                } catch (e) {
                    console.error(e);
                    log(`Error: ${e.message}`, "fail");
                }
            }

            run();
        </script>
    </body>
</html>
