<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Wasm IDP Auth Test</title>
        <style>
            body {
                font-family: monospace;
                background: #1e1e1e;
                color: #d4d4d4;
                padding: 2rem;
            }

            .success {
                color: #4caf50;
            }

            .fail {
                color: #f44336;
            }

            .info {
                color: #569cd6;
            }

            .warn {
                color: #ce9178;
            }
        </style>
    </head>

    <body>
        <h1>🦀 Rust Wasm IDP Auth Helper</h1>
        <div id="output">Loading...</div>

        <script type="module">
            import init, {
                IdpAuthHelper,
            } from "./pkg/nf_ndc_connect_public.js";

            async function run() {
                const out = document.getElementById("output");
                const log = (msg, cls = "info") => {
                    const div = document.createElement("div");
                    div.innerHTML = msg;
                    div.className = cls;
                    out.appendChild(div);
                };

                try {
                    // 1. Initialize Wasm
                    await init();
                    out.innerHTML = "";

                    // 2. Load Public Key and JWT
                    const [certRes, jwtRes] = await Promise.all([
                        fetch("./cert.pem"),
                        fetch("./sample-jwt.txt"),
                    ]);
                    const publicKey = await certRes.text();
                    const rawJwt = (await jwtRes.text()).trim();

                    // 3. Initialize Helper
                    log("🔐 Initializing Helper with Public Key...");
                    const helper = new IdpAuthHelper(publicKey);
                    log("✅ Helper Initialized", "success");

                    // 4. Validate JWT & Get User Context
                    const isValid = helper.isValid(rawJwt);
                    log(
                        `🔹 isValid(JWT): <b>${isValid}</b>`,
                        isValid ? "success" : "fail",
                    );
                    if (!isValid) return;

                    // --- NEW: Generate Context Object ---
                    const user = helper.validate(rawJwt);
                    // debugger;
                    log("✅ User Context Parsed", "success");

                    // 5. List Groups
                    // Accessed via getter property .summaries on the user object
                    const groups = user.summaries;

                    log(`<br>📂 <b>User Groups:</b>`);
                    groups.forEach((g) => {
                        const tag = g.is_direct_member
                            ? "(direct)"
                            : "(via role)";
                        log(
                            `&nbsp;&nbsp;🏢 <b>${g.group_name}</b> [${g.group}] ${tag}`,
                        );
                        g.roles.forEach((r) =>
                            log(`&nbsp;&nbsp;&nbsp;&nbsp;🎭 Role: ${r}`),
                        );
                        g.permissions.forEach((p) =>
                            log(`&nbsp;&nbsp;&nbsp;&nbsp;🔑 Permission: ${p}`),
                        );
                    });

                    // 6. Check group membership
                    const testGroup = "group_test_dhilipsiva1"; // Adjust to match your data

                    // Call on 'user', no jwt arg
                    const hasGrp = user.hasGroup(testGroup);
                    log(
                        `<br>🔹 hasGroup('${testGroup}'): <b>${hasGrp}</b>`,
                        hasGrp ? "success" : "fail",
                    );

                    // 7. Check role for a specific group
                    const testRole = "role_dhilipsiva_1"; // Adjust to match your data

                    // Renamed to hasRole, called on user
                    const hasRole = user.hasRole(testRole, testGroup);
                    log(
                        `<br>🔹 hasRole('${testRole}', '${testGroup}'): <b>${hasRole}</b>`,
                        hasRole ? "success" : "fail",
                    );

                    // 8. Check permission for a specific group
                    const testPerm = "permission_dhilipsiva_1"; // Adjust to match your data

                    // Renamed to hasPermission, called on user
                    const hasPerm = user.hasPermission(testPerm, testGroup);
                    log(
                        `<br>🔹 hasPermission('${testPerm}', '${testGroup}'): <b>${hasPerm}</b>`,
                        hasPerm ? "success" : "fail",
                    );

                    // --- NEW: Check Multiple Permissions ---
                    
                    // 8a. hasPermissions (ALL must exist)
                    const reqPermsAll = ["permission_dhilipsiva_1", "permission_dhilipsiva_2"]; 
                    const hasAll = user.hasPermissions(reqPermsAll, testGroup);
                    log(
                        `<br>🔹 hasPermissions(['${reqPermsAll.join("', '")}'], '${testGroup}'): <b>${hasAll}</b>`,
                        hasAll ? "success" : "fail", // Update based on your actual test data expectations
                    );

                    // 8b. hasPermissionsAny (AT LEAST ONE must exist)
                    const reqPermsAny = ["permission_dhilipsiva_1", "permission_fake_99"];
                    const hasAny = user.hasPermissionsAny(reqPermsAny, testGroup);
                    log(
                        `🔹 hasPermissionsAny(['${reqPermsAny.join("', '")}'], '${testGroup}'): <b>${hasAny}</b>`,
                        hasAny ? "success" : "fail",
                    );


                    // 9. Optional group — omit group_name (should error if user has >1 group)
                    log(`<br>⚙️ <b>Testing optional group (null):</b>`);

                    try {
                        const result = user.hasRole(testRole, null);
                        log(
                            `🔹 hasRole('${testRole}', null): <b>${result}</b>`,
                            "success",
                        );
                    } catch (e) {
                        log(
                            `⚠️ hasRole('${testRole}', null): <b>${e.message}</b>`,
                            "warn",
                        );
                    }

                    try {
                        // Testing plural check with null group
                        const result = user.hasPermissionsAny(["some_perm"], null);
                        log(
                            `🔹 hasPermissionsAny(['some_perm'], null): <b>${result}</b>`,
                            "success",
                        );
                    } catch (e) {
                         log(
                            `⚠️ hasPermissionsAny(['some_perm'], null): <b>${e.message}</b>`,
                            "warn",
                        );
                    }

                    // 10. Admin checks (Getters on user object)
                    log(`<br>🔹 isAdmin: <b>${user.isAdmin}</b>`);
                    log(`🔹 isGlobalAdmin: <b>${user.isGlobalAdmin}</b>`);
                } catch (e) {
                    console.error(e);
                    log(`❌ Error: ${e.message}`, "fail");
                }
            }

            run();
        </script>
    </body>
</html>
