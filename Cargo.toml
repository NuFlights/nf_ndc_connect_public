[package]
name = "nf_ndc_connect_public"
version = "0.11.0"
edition = "2024"
description = "Shared IDP Claims & Auth Logic for Rust, Python (Maturin), and Wasm (Wasm-Pack)"
license = "MIT"
repository = "https://github.com/NuFlights/nf_ndc_connect_public"
# ---------------------------------------------

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
python = ["dep:pyo3"]
wasm = ["dep:wasm-bindgen", "dep:serde-wasm-bindgen", "dep:wasm-bindgen-futures"]
login = ["dep:reqwest"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jsonwebtoken = { version = "10.2.0", features = ["rust_crypto"] }
chrono = "0.4.43"
getrandom = { version = "0.2", features = ["js"] }
base64 = "0.22"
lz4_flex = "0.11"

# Optional: Python
pyo3 = { version = "0.27.2", features = ["extension-module"], optional = true }

# Optional: WASM
wasm-bindgen = { version = "0.2.108", optional = true }
serde-wasm-bindgen = { version = "0.6.5", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }

# Optional: Login (Rust + Python only, not WASM)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.12", features = ["json", "blocking"], optional = true }
# ----------------------------------------------------
